<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente</title>
  <link rel="stylesheet" href="./css/chat.css">
</head>
<body>
  <div class="chat-header">
    <h2>Asistente de Historia del Perú</h2>
  </div>

  <div id="chat-box"></div>

  <form id="form-chat" class="input-area">
    <input type="text" id="pregunta" placeholder="Pregunta sobre la historia del Perú..." autocomplete="off" required>
    <button type="submit" id="btn-enviar">Enviar</button>
  </form>

  <script>
    const form = document.getElementById('form-chat');
    const input = document.getElementById('pregunta');
    const btn = document.getElementById('btn-enviar');
    const chatBox = document.getElementById('chat-box');

    function agregarMensaje(texto, remitente) {
      const div = document.createElement('div');
      div.className = `msg ${remitente}`;
      div.textContent = texto;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto = input.value.trim();
      if (!texto) return;

      agregarMensaje(texto, 'user');
      input.value = '';
      input.disabled = true;
      btn.disabled = true;

      const cargando = document.createElement('div');
      cargando.className = 'msg bot';
      cargando.textContent = 'Pensando...';
      chatBox.appendChild(cargando);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat-texto', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: texto })
        });

        const data = await res.json();
        chatBox.removeChild(cargando);

        if (data.error) {
          agregarMensaje(data.error, 'bot');
        } else {
          agregarMensaje(data.respuesta, 'bot');
        }
      } catch (err) {
        chatBox.removeChild(cargando);
        agregarMensaje("Error al conectar con el servidor", 'bot');
      } finally {
        input.disabled = false;
        btn.disabled = false;
        input.focus();
      }
    })
  </script>
</body>
</html>
